[package]
name = "aw"
version = "0.7.24"
edition = "2024"
description = "Issue worker CLI for faberline agents: claim one issue, do its stage, report back."
license = "MIT"
repository = "https://github.com/faberline/aw"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "1.2.1"

[lints.clippy]
mod_module_files = "deny"

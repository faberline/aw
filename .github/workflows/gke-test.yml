# Shared GKE test run for any faberline repository. aw owns this file; a
# repository calls it after it pushes its test image to GHCR:
#
#   jobs:
#     gke-test:
#       needs: image
#       permissions: { id-token: write, contents: read, packages: read }
#       uses: faberline/aw/.github/workflows/gke-test.yml@main
#       with:
#         image: ${{ needs.image.outputs.image }}
#         test-job: k8s/gke-test-job
#
# The run signs in as gke-test-<repo>, which exists only when the repository
# has a row in infra/gke-test/pools.yaml. Full contract:
# docs/standards/test-cluster.md.
name: gke-test

on:
  workflow_call:
    inputs:
      image:
        description: Image to deploy, for example ghcr.io/faberline/keep:sha-<git12>@sha256:<digest>.
        required: true
        type: string
      test-job:
        description: >-
          Kustomize folder with exactly one Job (plus its ConfigMaps, Secrets,
          ServiceAccount, Role, and RoleBinding). The run applies it in the
          namespace after every Deployment, StatefulSet, and DaemonSet is rolled
          out, and passes only when the Job completes. Set this, test-command,
          or both.
        required: false
        default: ""
        type: string
      test-command:
        description: >-
          Bash command run from the repository root after the test Job passes,
          or after the rollouts when there is no test Job. It gets NAMESPACE,
          IMAGE, EVIDENCE_DIR, RUN_LABEL, and KUBECONFIG.
        required: false
        default: ""
        type: string
      test-image:
        description: >-
          Client image for the test Job only, for example
          ghcr.io/faberline/<repo>-test-client:sha-<git12>@sha256:<digest>. Set
          it with test-image-name.
        required: false
        default: ""
        type: string
      test-image-name:
        description: >-
          Image name in the test Job to replace with test-image. It must differ
          from image-name.
        required: false
        default: ""
        type: string
      test-env:
        description: >-
          Lines of KEY=VALUE for this call, for example one cell of a matrix.
          The test Job gets them in the ConfigMap gke-test-env (use envFrom).
          They are in the evidence, so never put a secret here.
        required: false
        default: ""
        type: string
      evidence-suffix:
        description: >-
          Added to the evidence artifact name. Set it when one workflow run
          calls this workflow more than once, for example from a matrix.
        required: false
        default: ""
        type: string
      overlay:
        description: Kustomize overlay to deploy.
        required: false
        default: k8s/overlays/gke-test
        type: string
      image-name:
        description: Image name in the overlay to replace. Empty means the repository name.
        required: false
        default: ""
        type: string
      namespace:
        description: Namespace of the overlay. Empty means the repository name.
        required: false
        default: ""
        type: string
      lane:
        description: >-
          Lets this call run beside the other runs of the repository. Empty
          means the call waits for them. Set it only with its own `namespace`
          (`<repo>-<something>`) and an overlay without cluster-scoped objects:
          run.sh refuses the run otherwise.
        required: false
        default: ""
        type: string
      ttl-minutes:
        description: >-
          Job timeout in minutes, at most 360 (the limit of a GitHub-hosted
          job). The reaper may delete the namespace 15 minutes after it. Split
          longer tests into more than one call.
        required: false
        default: 90
        type: number
      queue-minutes:
        description: >-
          Longest wait for the other runs of the repository (or of the lane)
          before this run starts. The run fails after it. The wait and
          ttl-minutes together must stay below 360.
        required: false
        default: 120
        type: number
      aw-ref:
        description: Ref of faberline/aw whose scripts/gke-test/ this run uses. Match the ref in `uses:`.
        required: false
        default: main
        type: string

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  gke-test:
    name: deploy + test on shared GKE
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Runs of one repository share its namespace and its cluster-wide CRDs,
    # so they queue. Different repositories run at the same time. A run with a
    # `lane` has its own namespace and no cluster-scoped objects, so it has
    # its own queue and runs beside the others.
    #
    # The queue is a Kubernetes Lease in the cluster (scripts/gke-test/lock.sh),
    # not a `concurrency` group. Do not add a group to this job: GitHub keeps
    # only one waiting job in a group and cancels the others, which made the
    # callers' gates red (aw#293). With the Lease every job waits for its turn
    # and nothing is cancelled.
    #
    # The job timeout is the GitHub limit, 360 minutes, set on purpose: the wait
    # has `queue-minutes` and the run has `ttl-minutes`, and together they stay
    # below 360, so the job timeout must not cut the teardown.
    env:
      REPO: ${{ github.event.repository.name }}
      OVERLAY: ${{ inputs.overlay }}
      IMAGE: ${{ inputs.image }}
      IMAGE_NAME: ${{ inputs.image-name }}
      NAMESPACE: ${{ inputs.namespace || github.event.repository.name }}
      LANE: ${{ inputs.lane }}
      TEST_JOB: ${{ inputs.test-job }}
      TEST_COMMAND: ${{ inputs.test-command }}
      TEST_IMAGE: ${{ inputs.test-image }}
      TEST_IMAGE_NAME: ${{ inputs.test-image-name }}
      TEST_ENV: ${{ inputs.test-env }}
      RUN_LABEL: gha-${{ github.run_id }}-${{ github.run_attempt }}
      TTL_MINUTES: ${{ inputs.ttl-minutes }}
      QUEUE_MINUTES: ${{ inputs.queue-minutes }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: faberline/aw
          ref: ${{ inputs.aw-ref }}
          path: .gke-test-aw
          # run.sh reads pools.yaml to check which pools this repository owns.
          sparse-checkout: |
            scripts/gke-test
            infra/gke-test

      - name: Prepare run folders
        run: |
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/gke-test-evidence" >> "$GITHUB_ENV"
          echo "KUBECONFIG=${RUNNER_TEMP}/gke-test-kubeconfig" >> "$GITHUB_ENV"
          # Two calls of one workflow run have the same RUN_LABEL, so the
          # holder name of the Lease gets a random part.
          echo "LOCK_HOLDER=${RUN_LABEL}-$(openssl rand -hex 4)" >> "$GITHUB_ENV"

      # Values from `terraform -chdir=infra/gke-test output` in faberline/aw.
      - name: Sign in to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/406744653021/locations/global/workloadIdentityPools/faberline-github/providers/github-oidc
          service_account: gke-test-${{ github.event.repository.name }}@axiom-502607.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get cluster credentials
        run: |
          gcloud container clusters get-credentials faberline-test \
            --project=axiom-502607 --zone=asia-east1-a

      # kubectl, kustomize, yq, and jq come with ubuntu-latest.
      #
      # Waits while another run of this repository (or of this lane) holds the
      # Lease, for at most queue-minutes. The Lease is free again when that
      # run's last step releases it.
      - name: Wait for the turn of this run
        run: .gke-test-aw/scripts/gke-test/lock.sh acquire

      - name: Deploy, test, and tear down
        timeout-minutes: ${{ inputs.ttl-minutes }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: .gke-test-aw/scripts/gke-test/run.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gke-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.evidence-suffix && format('-{0}', inputs.evidence-suffix) || '' }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

      # run.sh tears down on every in-process exit. This step covers a
      # killed process (timeout-minutes, runner shutdown). The reaper covers
      # the rest. It runs only while this run holds the Lease, and renews it
      # first: without the Lease (the wait failed, or the job was cancelled in
      # the wait) the namespace belongs to another run, and a teardown would
      # delete that run.
      - name: Tear down (backup)
        if: always()
        run: |
          if .gke-test-aw/scripts/gke-test/lock.sh renew; then
            .gke-test-aw/scripts/gke-test/teardown.sh
          else
            echo "This run does not hold the Lease; nothing to tear down."
          fi

      # Last step, always: the next waiting run starts when the Lease is gone.
      # A Lease that stays (a lost runner) expires ttl-minutes plus 15 minutes
      # after the run started.
      - name: Release the turn
        if: always()
        run: |
          .gke-test-aw/scripts/gke-test/lock.sh release \
            || echo "::warning::The Lease was not released; it expires by itself."

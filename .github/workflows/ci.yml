# CI stages: lint -> test -> e2e -> gate.
# See docs/standards/ci.md. A ruleset would require only the "gate" job.
# Keep its name fixed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aw-ci
      - run: cargo fmt --all -- --check
      - name: gke-test scripts (shellcheck, tests)
        run: |
          shellcheck -S warning -x scripts/gke-test/*.sh scripts/gke-test/tests/*.sh
          scripts/gke-test/tests/run-tests.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Runs the workspace tests with coverage (S8, docs/standards/coverage.md).
  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aw-coverage
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: ./.github/actions/coverage
        with:
          summary: target/coverage.json

  gate:
    name: gate
    if: always()
    needs: [lint, test-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

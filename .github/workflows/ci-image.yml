name: ci-image

# Publishes the shared CI images to GHCR:
# - ghcr.io/faberline/ci-base: Rust stable, uv, kind and kubectl.
# - ghcr.io/faberline/ci-rust: the image of the work Jobs of ci-on-gke: a
#   pinned Rust toolchain (one tag for each pinned version), sccache, kubectl, cargo-llvm-cov, cargo-deny and Node.js (docs/standards/ci-on-gke.md).
# - ghcr.io/faberline/kindest-node: a copy of the kind node image, so a
#   kind cluster does not pull from Docker Hub.
# A pull request only builds the image. main and the weekly run publish it.

on:
  pull_request:
    paths:
      - ci/**
      - .github/actions/kind/**
      - .github/workflows/ci-image.yml
  push:
    branches: [main]
    paths:
      - ci/**
      - .github/actions/kind/**
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run. main, the weekly run
# and a manual run never cancel: they publish the image.
concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE: ghcr.io/faberline/ci-base
  RUST: ghcr.io/faberline/ci-rust
  NODE: ghcr.io/faberline/kindest-node
  NODE_TAG: v1.33.1
  NODE_SOURCE: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
  NODE_DIGEST: sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ci/base
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BASE }}:1
            ${{ env.BASE }}:sha-${{ github.sha }}
      - name: Copy the kind node image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            docker buildx imagetools create -t "$NODE:$NODE_TAG" "$NODE_SOURCE" && break
            test "$i" = 5 && exit 1
            sleep $((i * 10))
          done
          got="sha256:$(docker buildx imagetools inspect --raw "$NODE:$NODE_TAG" | sha256sum | cut -d' ' -f1)"
          echo "copied digest: $got"
          test "$got" = "$NODE_DIGEST"

  # One image for each Rust version that a repository pins in its
  # rust-toolchain.toml. The versions are in the matrix below: add a version
  # when a repository pins it, and remove it when no repository pins it.
  # Every version gets the same components (see ci/rust/Dockerfile).
  publish-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.99.1", "1.96.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the work Job image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ci/rust
          build-args: RUST_VERSION=${{ matrix.rust_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.RUST }}:${{ matrix.rust_version }}
            ${{ env.RUST }}:sha-${{ github.sha }}-${{ matrix.rust_version }}

  verify:
    needs: [publish, publish-rust]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/kind
        with:
          name: ci-image-check
      - run: kubectl get nodes
      - if: always()
        run: kind delete cluster --name ci-image-check || true
      - uses: ./.github/actions/kind
        with:
          create: "false"
      - run: |
          test -x "$KIND_BIN"
          docker image inspect "$KIND_NODE_IMAGE" >/dev/null

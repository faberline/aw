name: kind cluster from GHCR
description: >
  Creates a kind cluster with no download from GitHub releases or Docker Hub.
  The kind binary comes from ghcr.io/faberline/ci-base and the node image
  from ghcr.io/faberline/kindest-node. Each pull tries five times.
  The step puts kind on PATH and sets KIND_BIN and KIND_NODE_IMAGE for
  later steps. With create "false" it only installs kind and pulls the
  node image, for a job that creates its own clusters.

inputs:
  name:
    description: The cluster name. Needed when create is "true".
    default: ""
  create:
    description: '"true" creates the cluster; "false" only installs kind.'
    default: "true"
  wait:
    description: How long kind waits for the control plane.
    default: 120s
  token:
    description: >
      A token that can read the GHCR packages. The packages are private, so
      the calling job needs `permissions: packages: read` and the repository
      needs Actions access to both packages.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLUSTER: ${{ inputs.name }}
        CREATE: ${{ inputs.create }}
        WAIT: ${{ inputs.wait }}
        BASE: ghcr.io/faberline/ci-base:1
        NODE: ghcr.io/faberline/kindest-node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
        KIND_SHA256: c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        pull() {
          for i in 1 2 3 4 5; do
            docker pull --quiet "$1" && return 0
            sleep $((i * 10))
          done
          return 1
        }
        pull "$BASE"
        pull "$NODE"
        dir="$RUNNER_TEMP/faberline-kind"
        mkdir -p "$dir"
        id="$(docker create "$BASE")"
        docker cp "$id:/usr/local/bin/kind" "$dir/kind"
        docker rm "$id" >/dev/null
        echo "$KIND_SHA256  $dir/kind" | sha256sum --check --strict
        chmod +x "$dir/kind"
        echo "$dir" >> "$GITHUB_PATH"
        echo "KIND_BIN=$dir/kind" >> "$GITHUB_ENV"
        echo "KIND_NODE_IMAGE=$NODE" >> "$GITHUB_ENV"
        test "$CREATE" = true || exit 0
        test -n "$CLUSTER" || { echo "::error::name is required when create is true"; exit 1; }
        "$dir/kind" create cluster --name "$CLUSTER" --image "$NODE" --wait "$WAIT"
        test "$(kubectl config current-context)" = "kind-$CLUSTER"

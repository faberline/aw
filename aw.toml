# aw's own settings for the Faberline standards (docs/standards/).

# `aw desk patrol`: the repositories the desk looks at, the most important
# first. `--repo` replaces this list for one run.
[desk]
org = "faberline"
repos = ["sift", "core", "lumen", "som", "defer", "tape", "relay", "keep", "kit"]
aw = "aw"

# S8 test coverage: docs/standards/coverage.md. CI raises `line`; it never
# goes down.
[standards.coverage]
line = 91.21
target = 100

# Repo hygiene: docs/standards/repo-hygiene.md. The baseline is empty and
# stays empty; aw is clean.
[hygiene]
baseline = []

[[hygiene.root]]
path = ".claude-plugin"
reason = "The plugin marketplace manifest that Claude Code reads from the repo root."

[[hygiene.root]]
path = "infra"
reason = "The shared GKE test cluster config (infra/gke-test)."

[[hygiene.root]]
path = "plugins"
reason = "The shared Faberline skills (plugins/faberline); the marketplace installs them."

# S10 security: docs/standards/security.md. aw builds ci-rust itself; the proof
# jobs read the moving tag on purpose, so a digest would go stale at each build.
[[standards.security.exception]]
rule = "SEC3"
path = ".github/ci/proof-jobs.yaml"
reason = "ci-rust is built by aw in ci-image.yml; the proof jobs follow its tag. Pin the digest when ci-image.yml writes it."
expires = "2026-12-31"

# Node pools of the shared GKE test cluster. One row is one pool.
#
# aw owns this file. A repository asks for a pool, a bigger machine, or a
# higher max_nodes with a pull request here. Terraform in this folder reads
# the file with yamldecode and makes `pool-<pool>`:
#
# - min 0 nodes, max `max_nodes`; the autoscaler adds a node only while a pod
#   for that pool is Pending, and removes it about 10 minutes after the test
#   namespace is gone.
# - label `faberline.dev/pool=<pool>` and taint
#   `faberline.dev/pool=<pool>:NoSchedule`, so only pods that select this
#   pool run there. See docs/standards/test-cluster.md for the overlay patch.
#
# A repository can have more than one pool, one per role. The usual pair is
# the server pool (`<repo>`, one node per server replica) and the client pool
# (`<repo>-client`) for the test Job, so the load generator never takes CPU
# from the server it measures.
#
# Fields:
#   repo          GitHub repository name under faberline; also the namespace.
#   pool          Pool name: `<repo>` or `<repo>-<role>`. Default: repo.
#   machine_type  GCE machine type. The biggest pod must fit on one node.
#   spot          true for Spot VMs (about 70% cheaper; GCE may stop them).
#   max_nodes     Upper bound for this pool. At least the server replicas,
#                 because the server puts one replica on each node. The sum
#                 of all rows is the cost cap.
pools:
  # keep requests 2 CPU and 4Gi per pod (QoS Guaranteed), which does not fit
  # the 1930m allocatable of an e2-standard-2.
  - repo: keep
    machine_type: e2-standard-4
    spot: true
    max_nodes: 1
  # The test Job (kubectl, curl, jq) requests 250m and 256Mi.
  - repo: keep
    pool: keep-client
    machine_type: e2-medium
    spot: true
    max_nodes: 1
  # lumen's server pool. The operator's raft StatefulSet puts one replica on
  # each node (required pod anti-affinity on the hostname), up to 3 voters at
  # 1 CPU and 4Gi each. The direct-install Deployment (1 replica, 1 CPU, 4Gi)
  # and the operator itself share these nodes, which an e2-standard-2 cannot
  # hold.
  - repo: lumen
    machine_type: e2-standard-4
    spot: true
    max_nodes: 3
  # The test Job (kubectl, curl, jq, python3 for the 100k-doc fixture)
  # requests 500m and 1Gi.
  - repo: lumen
    pool: lumen-client
    machine_type: e2-medium
    spot: true
    max_nodes: 1

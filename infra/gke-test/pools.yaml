# Node pools of the shared GKE test cluster. One row is one pool.
#
# aw owns this file. A repository asks for a pool, a bigger machine, or a
# higher max_nodes with a pull request here. Terraform in this folder reads
# the file with yamldecode and makes `pool-<pool>`:
#
# - min 0 nodes, max `max_nodes`; the autoscaler adds a node only while a pod
#   for that pool is Pending, and removes it about 10 minutes after the test
#   namespace is gone.
# - label `faberline.dev/pool=<pool>` and taint
#   `faberline.dev/pool=<pool>:NoSchedule`, so only pods that select this
#   pool run there. See docs/standards/test-cluster.md for the overlay patch.
#
# A repository can have more than one pool, one per role. The usual pair is
# the server pool (`<repo>-server`, one node per server replica) and the client
# pool (`<repo>-client`) for the test Job, so the load generator never takes
# CPU from the server it measures.
#
# One pod gets one node. Each server replica and each test Job pod has a node
# of its own, and sets requests but no limits, so it can use the whole node.
# A shared-core type (e2-micro, e2-small, e2-medium) is too small for that:
# GKE's own DaemonSets take a large part of its CPU.
#
# Fields:
#   repo          GitHub repository name under faberline; also the namespace.
#   pool          Pool name: `<repo>-<role>`, for example `keep-server`.
#   machine_type  n4-standard-2 for every pool (2 vCPU, 8 GB memory).
#                 Pod requests must fit after GKE system reservations.
#                 N4 uses Hyperdisk boot disks. A PVC on these pools uses
#                 storageClassName dynamic-rwo. Results from larger machines
#                 do not qualify this hardware profile.
#   spot          true for Spot VMs (about 70% cheaper; GCE may stop them).
#   max_nodes     Upper bound for this pool. At least the server replicas,
#                 because the server puts one replica on each node. The sum
#                 of all rows is the cost cap.
pools:
  # Keep server. Consumer requests must fit the N4 two-vCPU node; a 2-CPU
  # request cannot fit after GKE system reservations.
  - repo: keep
    pool: keep-server
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
  # The test Job (kubectl, curl, jq) requests 250m and 256Mi.
  - repo: keep
    pool: keep-client
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
  # Lumen server pool. Up to three voters, one per node. Consumer requests
  # and the number of server-side pods must fit this pool's node budget.
  - repo: lumen
    pool: lumen-server
    machine_type: n4-standard-2
    spot: true
    max_nodes: 3
  # The e2e test Job (kubectl, curl, jq; jq builds the 100k-doc fixture)
  # requests 250m and 1Gi.
  - repo: lumen
    pool: lumen-client
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
  # Lumen performance server: one cell per node, up to three lanes.
  # The new profile is 2 vCPU and 8 GB before GKE reservations. Existing
  # results or acceptance assumptions for 2.5 CPU/16 GiB need fresh review;
  # changing the pool does not waive a performance or memory requirement.
  # Non-Spot keeps preemption out of cold-restart measurements.
  - repo: lumen
    pool: lumen-perf-server
    machine_type: n4-standard-2
    spot: false
    max_nodes: 3
  # Performance load generator: one per lane, separate from the server.
  # Non-Spot, with the same fixed N4 hardware profile.
  - repo: lumen
    pool: lumen-perf-client
    machine_type: n4-standard-2
    spot: false
    max_nodes: 3
  # tape's server pool: the operator's 2 replicas (leader election, required
  # anti-affinity) and the 1 Tape pod that it renders, one pod per node, plus 1
  # spare node so the HA suite's drain can move the evicted replica. Each pod
  # requests at most 500m and 512Mi.
  - repo: tape
    pool: tape-server
    machine_type: n4-standard-2
    spot: true
    max_nodes: 4
  # The e2e test Job (tape-it, kubectl) requests 250m and 256Mi.
  - repo: tape
    pool: tape-client
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
  # defer's server pool. The e2e installs the operator (2 replicas, 100m and
  # 128Mi each, no anti-affinity) and one Defer instance that it renders; the
  # direct-install StatefulSet and operator requests must fit the node.
  # The second node is room for the recovery step, which deletes the Defer
  # pod and waits for its replacement on the same PVC.
  - repo: defer
    pool: defer-server
    machine_type: n4-standard-2
    spot: true
    max_nodes: 2
  # The e2e test Job requests at most 250m and 256Mi.
  - repo: defer
    pool: defer-client
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
  # relay's server pool: the raft failover suite runs 3 voters, one pod per
  # node (required anti-affinity), each requesting 250m and 512Mi. The suite
  # deletes the leader pod, not its node, so the replacement pod returns to the
  # same node and zonal PVC; no spare node is needed.
  - repo: relay
    pool: relay-server
    machine_type: n4-standard-2
    spot: true
    max_nodes: 3
  # The e2e test Job (relay-it, kubectl) requests 250m and 256Mi.
  - repo: relay
    pool: relay-client
    machine_type: n4-standard-2
    spot: true
    max_nodes: 1
